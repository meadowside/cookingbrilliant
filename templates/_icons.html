{% macro icon(name, size=22) %}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'scale' %}<rect x="3" y="7" width="18" height="13" rx="3"/><rect x="7" y="10" width="10" height="5" rx="1"/><path d="M8 7V5h8v2"/>
{% elif name == 'oven' %}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18"/><circle cx="7" cy="5.5" r=".6"/><circle cx="10" cy="5.5" r=".6"/><rect x="6.5" y="11" width="11" height="7" rx="1"/>
{% elif name == 'roast' %}<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/>
{% elif name == 'scaler' %}<path d="M4 20 20 4"/><path d="M14 4h6v6"/><path d="M10 20H4v-6"/>
{% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{% elif name == 'moon' %}<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{% elif name == 'star' %}<path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/>
{% elif name == 'tin' %}<ellipse cx="12" cy="7" rx="9" ry="3"/><path d="M3 7v10c0 1.7 4 3 9 3s9-1.3 9-3V7"/>
{% elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{% endif %}
</svg>
{% endmacro %}
