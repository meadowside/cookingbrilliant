name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py

      # Fingerprints of the pages currently live, so we only notify search engines about changes.
      - name: Fetch live page fingerprints
        run: curl -fsS https://cookingbrilliant.com/page-hashes.json -o old-hashes.json || echo '{}' > old-hashes.json

      # Uploads only changed files. Needs three repository secrets:
      # FTP_SERVER (the hosting server name, e.g. premium75.web-hosting.com), FTP_USERNAME, FTP_PASSWORD.
      # Create a cPanel FTP account whose home directory is the site's document root.
      - name: Deploy to Namecheap over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

      - name: Notify search engines (IndexNow)
        run: python scripts/indexnow.py old-hashes.json dist/page-hashes.json
